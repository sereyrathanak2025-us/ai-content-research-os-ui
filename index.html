// ─── Worker Entry Point ─────────
export default {
  async fetch(request, env) {
    const url = new URL(request.url);
    if (request.method === "OPTIONS") return new Response(null, { headers: CORS });

    // GET / — serve frontend
    if (url.pathname === "/" && request.method === "GET") {
      return new Response(FRONTEND_HTML, { headers: { "Content-Type": "text/html; charset=utf-8", ...CORS } });
    }

    // GET /api/status — JSON status
    if (url.pathname === "/api/status" && request.method === "GET") {
      return json({
        status: "ok",
        providers_configured: { cloudflare: Boolean(env.AI), openrouter: Boolean(env.OPENROUTER_API_KEY), google: Boolean(env.GEMINI_API_KEY) },
        bindings: { ai: Boolean(env.AI), youtube: Boolean(env.YOUTUBE_API_KEY) }
      });
    }

    // POST /api/complete — generic LLM call
    if (url.pathname === "/api/complete" && request.method === "POST") {
      let body;
      try { body = await request.json(); } catch { return json({ error: "Invalid JSON" }, 400); }
      if (!body.prompt || !body.provider || !body.model) return json({ error: "Missing prompt, provider, or model" }, 400);
      try {
        const result = await callLLM(body.prompt, body.provider, body.model, env);
        return json({ text: result.text, model_used: result.model });
      } catch (e) { return json({ error: e.message }, 500); }
    }

    // POST /api/generate-insights — full orchestration
    if (url.pathname === "/api/generate-insights" && request.method === "POST") {
      let body;
      try { body = await request.json(); } catch { return json({ error: "Invalid JSON" }, 400); }
      const { topic, creativeBrief, referenceChannels, provider: p, model: m } = body;
      if (!topic) return json({ error: "Missing topic" }, 400);
      try {
        const result = await orchestrate(topic, creativeBrief || "", referenceChannels || [], p || "cloudflare", m || "@cf/meta/llama-3.1-8b-instruct-fast", env);
        return json(result);
      } catch (e) {
        return json({ pipeline: { step1: { status: "failed", label: "System", message: e.message } }, error: "Orchestration failed: " + e.message });
      }
    }

    return json({ error: "Not found" }, 404);
  }
};
